[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-queue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.137.2",
    "uvicorn[standard]==0.49.0",
    "gunicorn==26.0.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.18",
    "black==26.5.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "worker"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]
